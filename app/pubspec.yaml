name: lesho_app
description: Aplicación para la comunicación entre niños sordos y personas oyentes mediante el Lenguaje de Señas Hondureño (LESHO).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+9
  tflite_flutter: ^0.12.1
  video_player: ^2.8.3
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/labels/
    - assets/videos/
    - assets/clips/piloto/
