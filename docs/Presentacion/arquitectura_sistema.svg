<text x="1128.9" y="983.0" font-size="13" fill="#5C6472" font-weight="normal" text-anchor="start" font-style="normal">dirección de la dependencia</text>
<text x="24.0" y="1020.0" font-size="14" fill="#1A1D24" font-weight="normal" text-anchor="start" font-style="normal">Estilo arquitectónico: monolito en capas ejecutado sobre dos contextos de concurrencia. Las capas superiores dependen de las inferiores y ninguna capa inferior conoce a las superiores.</text>
<text x="24.0" y="1044.0" font-size="14" fill="#1A1D24" font-weight="normal" text-anchor="start" font-style="normal">Restricción transversal: ningún componente abre una conexión de red. La privacidad y el funcionamiento sin internet son consecuencia de esta decisión estructural, no de una configuración.</text>
</svg>