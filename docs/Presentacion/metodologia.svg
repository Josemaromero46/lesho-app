<svg viewBox="0 0 1400 620" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect x="0" y="0" width="1400" height="620" fill="#ffffff"/>

  <!-- ======================= TIPO DE INVESTIGACION ======================= -->
  <g id="tipo">
    <text x="96" y="34" font-size="15" letter-spacing="1.6" fill="#8A93A0">TIPO DE INVESTIGACIÓN</text>

    <rect x="96" y="48" width="170" height="50" rx="25" fill="#F7F4EE" stroke="#C8CFDA" stroke-width="2"/>
    <text x="181" y="80" font-size="21" fill="#1F3A5F" text-anchor="middle">Aplicada</text>

    <rect x="280" y="48" width="150" height="50" rx="25" fill="#F7F4EE" stroke="#C8CFDA" stroke-width="2"/>
    <text x="355" y="80" font-size="21" fill="#1F3A5F" text-anchor="middle">Mixta</text>

    <rect x="444" y="48" width="330" height="50" rx="25" fill="#F7F4EE" stroke="#C8CFDA" stroke-width="2"/>
    <text x="609" y="80" font-size="21" fill="#1F3A5F" text-anchor="middle">Exploratoria y descriptiva</text>
  </g>

  <line x1="812" y1="30" x2="812" y2="104" stroke="#E3DDD2" stroke-width="2"/>

  <g id="poblacion">
    <text x="846" y="34" font-size="15" letter-spacing="1.6" fill="#8A93A0">POBLACIÓN Y MUESTRA</text>

    <rect x="846" y="48" width="496" height="50" rx="25" fill="#F7F4EE" stroke="#C8CFDA" stroke-width="2"/>
    <text x="1094" y="80" font-size="21" fill="#1F3A5F" text-anchor="middle">30 personas, muestreo intencional</text>
  </g>

  <!-- ======================= EL PROCESO ======================= -->
  <g id="proceso">
    <text x="700" y="146" font-size="27" font-weight="bold" fill="#1A1D24" text-anchor="middle">Cuatro etapas, en orden</text>

    <!-- Etapa 1 -->
    <g id="etapa-1">
      <rect x="96" y="180" width="278" height="212" rx="12" fill="#F7F4EE" stroke="#E3DDD2" stroke-width="2"/>
      <circle cx="235" cy="232" r="30" fill="#1F3A5F"/>
      <text x="235" y="243" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
      <text x="235" y="302" font-size="23" font-weight="bold" fill="#1A1D24" text-anchor="middle">Definir el</text>
      <text x="235" y="330" font-size="23" font-weight="bold" fill="#1A1D24" text-anchor="middle">vocabulario</text>
      <text x="235" y="362" font-size="17" fill="#5C6472" text-anchor="middle">con asesoría en LESHO</text>
    </g>

    <path d="M 386 286 L 424 286" stroke="#E8A13A" stroke-width="4"/>
    <path d="M 424 286 l -13 -9 l 0 18 z" fill="#E8A13A"/>

    <!-- Etapa 2 -->
    <g id="etapa-2">
      <rect x="436" y="180" width="278" height="212" rx="12" fill="#F7F4EE" stroke="#E3DDD2" stroke-width="2"/>
      <circle cx="575" cy="232" r="30" fill="#1F3A5F"/>
      <text x="575" y="243" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
      <text x="575" y="302" font-size="23" font-weight="bold" fill="#1A1D24" text-anchor="middle">Capturar los</text>
      <text x="575" y="330" font-size="23" font-weight="bold" fill="#1A1D24" text-anchor="middle">datos</text>
      <text x="575" y="362" font-size="17" fill="#5C6472" text-anchor="middle">con protocolo reproducible</text>
    </g>

    <path d="M 726 286 L 764 286" stroke="#E8A13A" stroke-width="4"/>
    <path d="M 764 286 l -13 -9 l 0 18 z" fill="#E8A13A"/>

    <!-- Etapa 3 -->
    <g id="etapa-3">
      <rect x="776" y="180" width="278" height="212" rx="12" fill="#F7F4EE" stroke="#E3DDD2" stroke-width="2"/>
      <circle cx="915" cy="232" r="30" fill="#1F3A5F"/>
      <text x="915" y="243" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
      <text x="915" y="302" font-size="23" font-weight="bold" fill="#1A1D24" text-anchor="middle">Entrenar los</text>
      <text x="915" y="330" font-size="23" font-weight="bold" fill="#1A1D24" text-anchor="middle">modelos</text>
      <text x="915" y="362" font-size="17" fill="#5C6472" text-anchor="middle">y llevarlos al teléfono</text>
    </g>

    <path d="M 1066 286 L 1104 286" stroke="#E8A13A" stroke-width="4"/>
    <path d="M 1104 286 l -13 -9 l 0 18 z" fill="#E8A13A"/>

    <!-- Etapa 4 -->
    <g id="etapa-4">
      <rect x="1116" y="180" width="226" height="212" rx="12" fill="#1F3A5F"/>
      <circle cx="1229" cy="232" r="30" fill="#ffffff"/>
      <text x="1229" y="243" font-size="30" font-weight="bold" fill="#1F3A5F" text-anchor="middle">4</text>
      <text x="1229" y="302" font-size="23" font-weight="bold" fill="#ffffff" text-anchor="middle">Evaluar</text>
      <text x="1229" y="340" font-size="17" fill="#C9D6E5" text-anchor="middle">desempeño técnico</text>
      <text x="1229" y="364" font-size="17" fill="#C9D6E5" text-anchor="middle">y usabilidad</text>
    </g>
  </g>

  <!-- ======================= VARIABLES ======================= -->
  <g id="variables">
    <text x="96" y="452" font-size="15" letter-spacing="1.6" fill="#8A93A0">VARIABLES ANALIZADAS</text>

    <rect x="96" y="478" width="290" height="60" rx="10" fill="#ffffff" stroke="#1F3A5F" stroke-width="2"/>
    <text x="241" y="516" font-size="20" fill="#1F3A5F" text-anchor="middle">Exactitud</text>

    <rect x="399" y="478" width="290" height="60" rx="10" fill="#ffffff" stroke="#1F3A5F" stroke-width="2"/>
    <text x="544" y="516" font-size="20" fill="#1F3A5F" text-anchor="middle">Puntaje F1</text>

    <rect x="702" y="478" width="330" height="60" rx="10" fill="#ffffff" stroke="#1F3A5F" stroke-width="2"/>
    <text x="867" y="510" font-size="20" fill="#1F3A5F" text-anchor="middle">Recursos del teléfono</text>
    <text x="867" y="530" font-size="14" fill="#5C6472" text-anchor="middle">CPU · RAM · batería · FPS</text>

    <rect x="1045" y="478" width="297" height="60" rx="10" fill="#ffffff" stroke="#1F3A5F" stroke-width="2"/>
    <text x="1194" y="516" font-size="20" fill="#1F3A5F" text-anchor="middle">Usabilidad percibida</text>
  </g>
</svg>
