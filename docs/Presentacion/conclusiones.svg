<svg viewBox="0 0 1400 620" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect x="0" y="0" width="1400" height="620" fill="#ffffff"/>

  <!-- ======================= FILA 1: LA VIABILIDAD ======================= -->
  <g id="fila-viabilidad">
    <text x="430" y="96" font-size="30" font-weight="bold" fill="#1F3A5F" text-anchor="end">LA VIABILIDAD</text>
    <line x1="470" y1="46" x2="470" y2="128" stroke="#E3DDD2" stroke-width="3"/>
    <text x="516" y="80" font-size="25" fill="#1A1D24">Reconocer el LESHO en tiempo real es alcanzable sin servidor y</text>
    <text x="516" y="114" font-size="25" fill="#1A1D24">sobre hardware de gama baja.</text>
    <text x="516" y="150" font-size="22" fill="#2E7D46">Lo que limitaba no era el aparato, sino la ausencia de datos del LESHO.</text>
  </g>

  <line x1="96" y1="212" x2="1342" y2="212" stroke="#EFEAE0" stroke-width="2"/>

  <!-- ======================= FILA 2: LA ASIMETRIA ======================= -->
  <g id="fila-asimetria">
    <text x="430" y="296" font-size="30" font-weight="bold" fill="#1F3A5F" text-anchor="end">LA ASIMETRÍA</text>
    <line x1="470" y1="246" x2="470" y2="328" stroke="#E3DDD2" stroke-width="3"/>
    <text x="516" y="280" font-size="25" fill="#1A1D24">Las dos direcciones no cuestan lo mismo: reconocer una seña exige</text>
    <text x="516" y="314" font-size="25" fill="#1A1D24">un corpus grabado, mostrarla exige un solo clip.</text>
    <text x="516" y="350" font-size="22" fill="#2E7D46">El vocabulario que muestra puede crecer más rápido que el que reconoce.</text>
  </g>

  <line x1="96" y1="412" x2="1342" y2="412" stroke="#EFEAE0" stroke-width="2"/>

  <!-- ======================= FILA 3: EL ALCANCE ======================= -->
  <g id="fila-alcance">
    <text x="430" y="496" font-size="30" font-weight="bold" fill="#1F3A5F" text-anchor="end">EL ALCANCE</text>
    <line x1="470" y1="446" x2="470" y2="528" stroke="#E3DDD2" stroke-width="3"/>
    <text x="516" y="480" font-size="25" fill="#1A1D24">La exactitud se midió sobre tomas que el modelo nunca vio, pero con</text>
    <text x="516" y="514" font-size="25" fill="#1A1D24">un número reducido de personas.</text>
    <text x="516" y="550" font-size="22" fill="#2E7D46">Queda demostrada la viabilidad, no todavía la generalización.</text>
  </g>
</svg>
