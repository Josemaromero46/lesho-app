<svg viewBox="0 0 1400 490" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect x="0" y="0" width="1400" height="490" fill="#ffffff"/>

  <!-- ======================= CIFRAS PRINCIPALES ======================= -->
  <g id="cifras">
    <g id="cifra-personas">
      <text x="466" y="96" font-size="76" font-weight="bold" fill="#2E6E7D" text-anchor="middle">30</text>
      <text x="466" y="134" font-size="21" fill="#5C6472" text-anchor="middle">personas participantes</text>
      <line x1="293" y1="168" x2="639" y2="168" stroke="#E3DDD2" stroke-width="2"/>
    </g>
    <g id="cifra-direcciones">
      <text x="933" y="96" font-size="76" font-weight="bold" fill="#2E6E7D" text-anchor="middle">2</text>
      <text x="933" y="134" font-size="21" fill="#5C6472" text-anchor="middle">direcciones evaluadas</text>
      <line x1="760" y1="168" x2="1106" y2="168" stroke="#E3DDD2" stroke-width="2"/>
    </g>
  </g>

  <!-- ======================= HALLAZGOS ======================= -->
  <g id="hallazgos">
    <text x="700" y="228" font-size="27" font-weight="bold" fill="#1A1D24" text-anchor="middle">Lo que dijeron las personas usuarias</text>
    <text x="700" y="262" font-size="20" fill="#5C6472" text-anchor="middle">Sesiones de uso en la Fundación CasAyuda, probando las dos direcciones</text>

    <g id="hallazgo-muneco">
      <rect x="96" y="336" width="295" height="118" rx="10" fill="#F7F4EE" stroke="#E3DDD2" stroke-width="2"/>
      <text x="243" y="386" font-size="22" font-weight="bold" fill="#1A1D24" text-anchor="middle">El muñeco se entiende</text>
      <text x="243" y="416" font-size="17" fill="#5C6472" text-anchor="middle">distinguen palabra de deletreo</text>
    </g>

    <g id="hallazgo-interfaz">
      <rect x="411" y="336" width="295" height="118" rx="10" fill="#F7F4EE" stroke="#E3DDD2" stroke-width="2"/>
      <text x="558" y="386" font-size="22" font-weight="bold" fill="#1A1D24" text-anchor="middle">La interfaz es clara</text>
      <text x="558" y="416" font-size="17" fill="#5C6472" text-anchor="middle">no hizo falta explicarla</text>
    </g>

    <g id="hallazgo-vocabulario">
      <rect x="726" y="336" width="295" height="118" rx="10" fill="#F7F4EE" stroke="#E3DDD2" stroke-width="2"/>
      <text x="873" y="386" font-size="22" font-weight="bold" fill="#1A1D24" text-anchor="middle">El vocabulario sirve</text>
      <text x="873" y="416" font-size="17" fill="#5C6472" text-anchor="middle">las cincuenta son pertinentes</text>
    </g>

    <g id="hallazgo-critica">
      <rect x="1041" y="336" width="295" height="118" rx="10" fill="#ffffff" stroke="#2E6E7D" stroke-width="2"/>
      <text x="1188" y="386" font-size="22" font-weight="bold" fill="#1A1D24" text-anchor="middle">Falla de vez en cuando</text>
      <text x="1188" y="416" font-size="17" fill="#5C6472" text-anchor="middle">en las señas dinámicas</text>
    </g>
  </g>

</svg>
