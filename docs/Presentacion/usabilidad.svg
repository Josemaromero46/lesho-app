<svg viewBox="0 0 1400 800" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1400" height="800" fill="#ffffff"/>
<text x="40.0" y="84.0" font-size="42" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1.4">30 PERSONAS</text>
<text x="376.5" y="84.0" font-size="23" fill="#5C6472" font-weight="normal" text-anchor="start" font-style="normal">Fundación CasAyuda  ·  sesiones de uso en las dos direcciones</text>
<line x1="40" y1="112" x2="1360" y2="112" stroke="#D8DEE6" stroke-width="2"/>
<rect x="40.0" y="148.0" width="650.0" height="470.0" rx="14" fill="#EAF2E7" stroke="#7FA871" stroke-width="2.2"/>
<text x="68.0" y="196.0" font-size="25" fill="#14293F" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.8">LO QUE VALORARON</text>
<rect x="64.0" y="227.0" width="602.0" height="112.0" rx="10" fill="#ffffff" stroke="#7FA871" stroke-width="1.8"/>
<text x="90.0" y="273.0" font-size="24" fill="#1A1D24" font-weight="bold" text-anchor="start" font-style="normal">El muñeco se entiende</text>
<text x="90.0" y="307.0" font-size="19" fill="#5C6472" font-weight="normal" text-anchor="start" font-style="italic">reconocen las señas y distinguen palabra de deletreo</text>
<rect x="64.0" y="365.0" width="602.0" height="112.0" rx="10" fill="#ffffff" stroke="#7FA871" stroke-width="1.8"/>
<text x="90.0" y="411.0" font-size="24" fill="#1A1D24" font-weight="bold" text-anchor="start" font-style="normal">La interfaz es clara</text>
<text x="90.0" y="445.0" font-size="19" fill="#5C6472" font-weight="normal" text-anchor="start" font-style="italic">completaron las tareas sin explicación previa</text>
<rect x="64.0" y="503.0" width="602.0" height="112.0" rx="10" fill="#ffffff" stroke="#7FA871" stroke-width="1.8"/>
<text x="90.0" y="549.0" font-size="24" fill="#1A1D24" font-weight="bold" text-anchor="start" font-style="normal">El vocabulario es pertinente</text>
<text x="90.0" y="583.0" font-size="19" fill="#5C6472" font-weight="normal" text-anchor="start" font-style="italic">las cincuenta señas les parecieron las adecuadas</text>
<rect x="710.0" y="148.0" width="650.0" height="470.0" rx="14" fill="#FCF0DC" stroke="#D6A54E" stroke-width="2.2"/>
<text x="738.0" y="196.0" font-size="25" fill="#14293F" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.8">LO QUE SEÑALARON</text>
<rect x="734.0" y="227.0" width="602.0" height="112.0" rx="10" fill="#ffffff" stroke="#D6A54E" stroke-width="1.8"/>
<text x="760.0" y="273.0" font-size="24" fill="#1A1D24" font-weight="bold" text-anchor="start" font-style="normal">Fallas ocasionales</text>
<text x="760.0" y="307.0" font-size="19" fill="#5C6472" font-weight="normal" text-anchor="start" font-style="italic">en señas dinámicas, poco frecuentes y sin impedir la tarea</text>
<rect x="734.0" y="365.0" width="602.0" height="112.0" rx="10" fill="#ffffff" stroke="#D6A54E" stroke-width="1.8"/>
<text x="760.0" y="411.0" font-size="24" fill="#1A1D24" font-weight="bold" text-anchor="start" font-style="normal">Quieren más palabras</text>
<text x="760.0" y="445.0" font-size="19" fill="#5C6472" font-weight="normal" text-anchor="start" font-style="italic">el límite de cincuenta se percibe corto</text>
<rect x="40.0" y="646.0" width="1320.0" height="134.0" rx="14" fill="#FFFDF6" stroke="#C8811A" stroke-width="2.6"/>
<text x="72.0" y="692.0" font-size="23" fill="#C8811A" font-weight="bold" text-anchor="start" font-style="normal">Alcance de esta evaluación</text>
<text x="72.0" y="728.0" font-size="21" fill="#1A1D24" font-weight="normal" text-anchor="start" font-style="normal">Retroalimentación cualitativa. Los instrumentos estructurados no alcanzaron a aplicarse dentro del plazo,</text>
<text x="72.0" y="758.0" font-size="21" fill="#1A1D24" font-weight="normal" text-anchor="start" font-style="normal">así que esta valoración no está cuantificada.</text>
</svg>