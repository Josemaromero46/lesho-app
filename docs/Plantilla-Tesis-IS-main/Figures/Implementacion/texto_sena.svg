<svg viewBox="0 0 1000 642" role="img" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Helvetica Neue',system-ui,Arial,sans-serif">
<title>Diagrama de secuencia del flujo de texto a seña</title>
<desc>La interfaz tokeniza el texto de la persona oyente; por cada palabra consulta el diccionario de senas, que le devuelve el clip de la sena si existe, o el clip de cada letra por el respaldo de deletreo; al final la interfaz entrega la secuencia completa al muneco de capsulas para que la reproduzca.</desc>
<rect x="0" y="0" width="1000" height="642" fill="#FFFFFF"/>

<defs>
<marker id="txb" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6B7A"/></marker>
</defs>

<g stroke="#B9C2CF" stroke-width="1.2" stroke-dasharray="4 4">
<line x1="125" y1="72" x2="125" y2="602"/>
<line x1="375" y1="72" x2="375" y2="602"/>
<line x1="625" y1="72" x2="625" y2="602"/>
<line x1="875" y1="72" x2="875" y2="602"/>
</g>

<g fill="none" stroke="#C6CCD6" stroke-width="1.2">
<rect x="57" y="196" width="650" height="306" rx="5"/>
<rect x="71" y="266" width="622" height="224" rx="5"/>
<rect x="85" y="392" width="594" height="88" rx="4"/>
</g>
<g font-size="12.5">
<rect x="57" y="196" width="48" height="19" fill="#E4E8EE" stroke="#C6CCD6" stroke-width="1"/><text x="81" y="209.5" font-weight="700" fill="#41485A" text-anchor="middle">loop</text><text x="111" y="209.5" font-style="italic" fill="#7A8290">[para cada palabra]</text>
<rect x="71" y="266" width="38" height="19" fill="#E4E8EE" stroke="#C6CCD6" stroke-width="1"/><text x="90" y="279.5" font-weight="700" fill="#41485A" text-anchor="middle">alt</text><text x="115" y="279.5" font-style="italic" fill="#7A8290">[¿la palabra existe en el diccionario?]</text>
<rect x="85" y="392" width="48" height="19" fill="#E4E8EE" stroke="#C6CCD6" stroke-width="1"/><text x="109" y="405.5" font-weight="700" fill="#41485A" text-anchor="middle">loop</text><text x="139" y="405.5" font-style="italic" fill="#7A8290">[para cada letra]</text>
</g>
<line x1="71" y1="346" x2="693" y2="346" stroke="#D3D8E0" stroke-width="0.9" stroke-dasharray="3 4"/>
<g font-size="13" font-style="italic" fill="#5E6672">
<text x="132" y="300">[existe]</text>
<text x="132" y="370">[no existe · respaldo por deletreo]</text>
</g>

<g stroke="#5F6B7A" stroke-width="1.7">
<line x1="125" y1="128" x2="369" y2="128" marker-end="url(#txb)"/>
<line x1="375" y1="166" x2="131" y2="166" stroke-dasharray="5 4" marker-end="url(#txb)"/>
<line x1="125" y1="238" x2="619" y2="238" marker-end="url(#txb)"/>
<line x1="625" y1="318" x2="131" y2="318" stroke-dasharray="5 4" marker-end="url(#txb)"/>
<line x1="125" y1="432" x2="619" y2="432" marker-end="url(#txb)"/>
<line x1="625" y1="468" x2="131" y2="468" stroke-dasharray="5 4" marker-end="url(#txb)"/>
<line x1="125" y1="542" x2="869" y2="542" marker-end="url(#txb)"/>
<line x1="875" y1="580" x2="131" y2="580" stroke-dasharray="5 4" marker-end="url(#txb)"/>
</g>
<g font-size="17" fill="#3B4250" text-anchor="middle">
<text x="250" y="121">texto en español</text>
<text x="250" y="159" font-style="italic" fill="#5E6672">palabras</text>
<text x="375" y="231">consultar palabra</text>
<text x="375" y="311" font-style="italic" fill="#5E6672">clip de la seña</text>
<text x="375" y="425">consultar letra</text>
<text x="375" y="461" font-style="italic" fill="#5E6672">clip de la letra</text>
<text x="497" y="535">reproducir la secuencia de clips</text>
<text x="503" y="573" font-style="italic" fill="#5E6672">fin de reproducción</text>
</g>

<g>
<rect x="45" y="20" width="160" height="48" rx="8" fill="#E1D5E7" stroke="#9673A6" stroke-width="1.8"/>
<text x="125" y="42" font-size="20" font-weight="700" fill="#4A2C57" text-anchor="middle">Interfaz</text><text x="125" y="59" font-size="12" fill="#6E5080" text-anchor="middle">Flutter</text>
<rect x="295" y="20" width="160" height="48" rx="8" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.8"/>
<text x="375" y="42" font-size="20" font-weight="700" fill="#6B5A00" text-anchor="middle">Tokenizador</text><text x="375" y="59" font-size="12" fill="#857015" text-anchor="middle">divide el texto</text>
<rect x="545" y="20" width="160" height="48" rx="8" fill="#F8CECC" stroke="#B85450" stroke-width="1.8"/>
<text x="625" y="42" font-size="20" font-weight="700" fill="#6B2A28" text-anchor="middle">Diccionario</text><text x="625" y="59" font-size="12" fill="#96504E" text-anchor="middle">de señas</text>
<rect x="795" y="20" width="160" height="48" rx="8" fill="#E1D5E7" stroke="#9673A6" stroke-width="1.8"/>
<text x="875" y="42" font-size="20" font-weight="700" fill="#4A2C57" text-anchor="middle">Muñeco</text><text x="875" y="59" font-size="12" fill="#6E5080" text-anchor="middle">de cápsulas</text>
</g>
</svg>
