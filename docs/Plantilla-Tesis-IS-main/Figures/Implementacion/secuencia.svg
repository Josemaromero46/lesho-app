<svg viewBox="0 0 1000 810" role="img" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Helvetica Neue',system-ui,Arial,sans-serif">
<title>Diagrama de secuencia del reconocimiento de señas</title>
<desc>Secuencia en tiempo real orquestada por el control: MediaPipe entrega landmarks al control, que arma la ventana y llama al Modelo A; segun la clase confirmada se agrega letra o no se hace nada en reposo, y cuando la persona usuaria abre la grabacion se acumulan landmarks hasta que la detiene, momento en que se llama al Modelo B y se muestra la sena.</desc>
<rect x="0" y="0" width="1000" height="810" fill="#FFFFFF"/>

<defs>
<marker id="sqd" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6B7A"/></marker>
</defs>

<g stroke="#B9C2CF" stroke-width="1.2" stroke-dasharray="4 4">
<line x1="85" y1="68" x2="85" y2="782"/>
<line x1="250" y1="68" x2="250" y2="782"/>
<line x1="415" y1="68" x2="415" y2="782"/>
<line x1="580" y1="68" x2="580" y2="782"/>
<line x1="745" y1="68" x2="745" y2="782"/>
<line x1="910" y1="68" x2="910" y2="782"/>
</g>

<g fill="none" stroke="#C6CCD6" stroke-width="1.2">
<rect x="28" y="92" width="944" height="690" rx="5"/>
<rect x="42" y="336" width="916" height="440" rx="5"/>
<rect x="56" y="516" width="888" height="118" rx="4"/>
</g>
<g font-size="12.5">
<rect x="28" y="92" width="48" height="19" fill="#E4E8EE" stroke="#C6CCD6" stroke-width="1"/><text x="52" y="105.5" font-weight="700" fill="#41485A" text-anchor="middle">loop</text><text x="84" y="105.5" font-style="italic" fill="#7A8290">[por cada fotograma · tiempo real]</text>
<rect x="42" y="336" width="38" height="19" fill="#E4E8EE" stroke="#C6CCD6" stroke-width="1"/><text x="61" y="349.5" font-weight="700" fill="#41485A" text-anchor="middle">alt</text><text x="86" y="349.5" font-style="italic" fill="#7A8290">[clase confirmada según Modelo A]</text>
<rect x="56" y="516" width="48" height="19" fill="#E4E8EE" stroke="#C6CCD6" stroke-width="1"/><text x="80" y="529.5" font-weight="700" fill="#41485A" text-anchor="middle">loop</text><text x="112" y="529.5" font-style="italic" fill="#7A8290">[hasta que se detiene la grabación]</text>
</g>
<g stroke="#D3D8E0" stroke-width="0.9" stroke-dasharray="3 4">
<line x1="42" y1="410" x2="958" y2="410"/>
<line x1="42" y1="478" x2="958" y2="478"/>
</g>
<g font-size="13" font-style="italic" fill="#5E6672">
<text x="100" y="373">[letra]</text>
<text x="100" y="432">[REPOSO]</text>
<text x="100" y="502">[botón · inicia grabación dinámica]</text>
</g>

<g stroke="#5F6B7A" stroke-width="1.7">
<line x1="85" y1="136" x2="244" y2="136" marker-end="url(#sqd)"/>
<line x1="250" y1="184" x2="574" y2="184" marker-end="url(#sqd)"/>
<line x1="580" y1="230" x2="421" y2="230" marker-end="url(#sqd)"/>
<line x1="415" y1="276" x2="574" y2="276" marker-end="url(#sqd)"/>
<line x1="580" y1="384" x2="904" y2="384" marker-end="url(#sqd)"/>
<line x1="250" y1="560" x2="574" y2="560" marker-end="url(#sqd)"/>
<line x1="580" y1="666" x2="739" y2="666" marker-end="url(#sqd)"/>
<line x1="745" y1="706" x2="586" y2="706" stroke-dasharray="5 4" marker-end="url(#sqd)"/>
<line x1="580" y1="746" x2="904" y2="746" marker-end="url(#sqd)"/>
</g>
<g font-size="17" fill="#3B4250" text-anchor="middle">
<text x="167" y="129">fotograma</text>
<text x="412" y="177">landmarks (126)</text>
<text x="500" y="223">ventana de 20</text>
<text x="495" y="269">clase + confianza</text>
<text x="742" y="377">agregar letra al deletreo</text>
<text x="412" y="553">acumular landmarks (manos + Pose)</text>
<text x="660" y="659">secuencia · 152 → 40</text>
<text x="665" y="699" font-style="italic" fill="#5E6672">seña reconocida</text>
<text x="742" y="739">mostrar seña</text>
</g>
<text x="412" y="151" font-size="12.5" font-style="italic" fill="#8A90A0" text-anchor="middle">[si hay mano detectada]</text>

<rect x="418" y="291" width="324" height="28" rx="5" fill="#FFF9E6" stroke="#E0C64D" stroke-width="1"/>
<text x="580" y="310" font-size="13.5" fill="#7A6410" text-anchor="middle">persistencia: 5 ventanas · ≥60% · cooldown 1200 ms</text>
<rect x="510" y="440" width="140" height="24" rx="5" fill="#FFF9E6" stroke="#E0C64D" stroke-width="1"/>
<text x="580" y="456" font-size="13.5" fill="#7A6410" text-anchor="middle">ninguna acción</text>

<g>
<rect x="15" y="20" width="140" height="48" rx="8" fill="#D5E8D4" stroke="#82B366" stroke-width="1.8"/>
<text x="85" y="42" font-size="20" font-weight="700" fill="#3A5A38" text-anchor="middle">Cámara</text><text x="85" y="59" font-size="12" fill="#4E6E4C" text-anchor="middle">frontal</text>
<rect x="180" y="20" width="140" height="48" rx="8" fill="#D5E8D4" stroke="#82B366" stroke-width="1.8"/>
<text x="250" y="42" font-size="20" font-weight="700" fill="#3A5A38" text-anchor="middle">MediaPipe</text><text x="250" y="59" font-size="12" fill="#4E6E4C" text-anchor="middle">Hands + Pose</text>
<rect x="345" y="20" width="140" height="48" rx="8" fill="#FFE6CC" stroke="#D79B00" stroke-width="1.8"/>
<text x="415" y="42" font-size="20" font-weight="700" fill="#7A4E00" text-anchor="middle">Modelo A</text><text x="415" y="59" font-size="12" fill="#946209" text-anchor="middle">CNN 1D</text>
<rect x="510" y="20" width="140" height="48" rx="8" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.8"/>
<text x="580" y="42" font-size="20" font-weight="700" fill="#6B5A00" text-anchor="middle">Control</text><text x="580" y="59" font-size="12" fill="#857015" text-anchor="middle">filtro y estados</text>
<rect x="675" y="20" width="140" height="48" rx="8" fill="#FFE6CC" stroke="#D79B00" stroke-width="1.8"/>
<text x="745" y="42" font-size="20" font-weight="700" fill="#7A4E00" text-anchor="middle">Modelo B</text><text x="745" y="59" font-size="12" fill="#946209" text-anchor="middle">LSTM</text>
<rect x="840" y="20" width="140" height="48" rx="8" fill="#E1D5E7" stroke="#9673A6" stroke-width="1.8"/>
<text x="910" y="42" font-size="20" font-weight="700" fill="#4A2C57" text-anchor="middle">Interfaz</text><text x="910" y="59" font-size="12" fill="#6E5080" text-anchor="middle">Flutter</text>
</g>
</svg>
