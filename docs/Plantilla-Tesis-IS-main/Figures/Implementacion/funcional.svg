<g fill="#3E6091" stroke="none">
<circle cx="-18" cy="-4" r="2"/><circle cx="-9" cy="-4" r="2"/><circle cx="0" cy="-4" r="2"/><circle cx="9" cy="-4" r="2"/><circle cx="18" cy="-4" r="2"/>
<circle cx="-18" cy="4" r="2"/><circle cx="-9" cy="4" r="2"/><circle cx="0" cy="4" r="2"/><circle cx="9" cy="4" r="2"/>
</g>
<line x1="-12" y1="10" x2="12" y2="10" stroke-width="2.5" stroke-linecap="round"/>
</g>
<text x="160" y="519" font-size="17" font-weight="500" fill="#3B4250" text-anchor="middle">El oyente</text>
<text x="160" y="538" font-size="17" font-weight="500" fill="#3B4250" text-anchor="middle">escribe</text>

<circle cx="400" cy="448" r="48" fill="#F8CECC" stroke="#B85450" stroke-width="2.5"/>
<g transform="translate(400,448)" stroke="#A5443F" fill="none" stroke-width="2.5" stroke-linejoin="round">
<path d="M0,-14 L-22,-9 L-22,13 L0,16 Z"/>
<path d="M0,-14 L22,-9 L22,13 L0,16 Z"/>
<path d="M-16,-3 L-6,-1 M-16,4 L-6,6 M16,-3 L6,-1 M16,4 L6,6" stroke-width="1.8"/>
</g>
<text x="400" y="519" font-size="17" font-weight="500" fill="#3B4250" text-anchor="middle">Busca en el</text>
<text x="400" y="538" font-size="17" font-weight="500" fill="#3B4250" text-anchor="middle">diccionario</text>

<circle cx="640" cy="448" r="48" fill="#E1D5E7" stroke="#9673A6" stroke-width="2.5"/>
<g transform="translate(640,448)">
<circle cx="0" cy="-22" r="8" fill="#6E4E82"/>
<rect x="-5" y="-12" width="10" height="22" rx="5" fill="#6E4E82"/>
<path d="M-4,-8 L-16,4 M4,-8 L16,4 M-3,10 L-9,26 M3,10 L9,26" stroke="#6E4E82" stroke-width="7" stroke-linecap="round" fill="none"/>
</g>
<text x="640" y="519" font-size="17" font-weight="500" fill="#3B4250" text-anchor="middle">El muñeco</text>
<text x="640" y="538" font-size="17" font-weight="500" fill="#3B4250" text-anchor="middle">hace la seña</text>

<circle cx="880" cy="448" r="48" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="2.5"/>
<g transform="translate(880,448)" stroke="#3E6091" fill="none">
<circle cx="0" cy="0" r="22" stroke-width="3"/>
<circle cx="-8" cy="-4" r="2.5" fill="#3E6091" stroke="none"/><circle cx="8" cy="-4" r="2.5" fill="#3E6091" stroke="none"/>
<path d="M-9,7 Q0,15 9,7" stroke-width="2.5" stroke-linecap="round"/>
