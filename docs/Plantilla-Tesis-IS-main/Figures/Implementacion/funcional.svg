<svg viewBox="0 0 1000 600" role="img" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Helvetica Neue',system-ui,Arial,sans-serif">
<title>Diagrama funcional del sistema LESHO</title>
<desc>Flujo funcional de las dos direcciones: en la Direccion 1 el nino firma, la camara capta, MediaPipe detecta, los modelos reconocen y aparece el texto; en la Direccion 2 el oyente escribe, la app busca en el diccionario, el muneco hace la sena y el nino la ve.</desc>
<rect x="0" y="0" width="1000" height="600" fill="#FFFFFF"/>

<defs>
<marker id="fa" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6B7A"/></marker>
</defs>

<text x="500" y="42" font-size="20" font-weight="700" fill="#45506A" text-anchor="middle">Dirección 1 · el niño firma y la app lo traduce a texto</text>
<g stroke="#5F6B7A" stroke-width="2.5">
<line x1="174" y1="150" x2="266" y2="150" marker-end="url(#fa)"/>
<line x1="374" y1="150" x2="466" y2="150" marker-end="url(#fa)"/>
<line x1="574" y1="150" x2="666" y2="150" marker-end="url(#fa)"/>
<line x1="774" y1="150" x2="866" y2="150" marker-end="url(#fa)"/>
</g>

<circle cx="120" cy="150" r="48" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="2.5"/>
<g transform="translate(120,150)" stroke="#3E6091" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
<circle cx="0" cy="-20" r="8" fill="#3E6091" stroke="none"/>
<line x1="0" y1="-12" x2="0" y2="8"/>
<path d="M0,-6 L-15,-20 M0,-6 L15,-20"/>
<circle cx="-15" cy="-20" r="3" fill="#3E6091" stroke="none"/><circle cx="15" cy="-20" r="3" fill="#3E6091" stroke="none"/>
<path d="M0,8 L-9,24 M0,8 L9,24"/>
</g>
<text x="120" y="221" font-size="17" font-weight="500" fill="#3B4250" text-anchor="middle">El niño hace</text>
<text x="120" y="240" font-size="17" font-weight="500" fill="#3B4250" text-anchor="middle">la seña</text>

<circle cx="320" cy="150" r="48" fill="#D5E8D4" stroke="#82B366" stroke-width="2.5"/>
<g transform="translate(320,150)" stroke="#4E7A46" stroke-width="3" fill="none">
<rect x="-24" y="-13" width="48" height="30" rx="5"/>
<rect x="-9" y="-19" width="18" height="7" rx="2"/>
<circle cx="0" cy="3" r="9"/>
<circle cx="0" cy="3" r="3.5" fill="#4E7A46" stroke="none"/>
</g>
<text x="320" y="221" font-size="17" font-weight="500" fill="#3B4250" text-anchor="middle">Cámara</text>
<text x="320" y="240" font-size="17" font-weight="500" fill="#3B4250" text-anchor="middle">frontal</text>

<circle cx="520" cy="150" r="48" fill="#D5E8D4" stroke="#82B366" stroke-width="2.5"/>
<g transform="translate(520,150)" stroke="#4E7A46" stroke-width="2.5" fill="none" stroke-linecap="round">
<path d="M0,20 L-18,-8 M0,20 L-9,-16 M0,20 L1,-20 M0,20 L11,-14 M0,20 L18,0"/>
<circle cx="0" cy="20" r="4" fill="#4E7A46" stroke="none"/>
<circle cx="-18" cy="-8" r="3" fill="#4E7A46" stroke="none"/><circle cx="-9" cy="-16" r="3" fill="#4E7A46" stroke="none"/><circle cx="1" cy="-20" r="3" fill="#4E7A46" stroke="none"/><circle cx="11" cy="-14" r="3" fill="#4E7A46" stroke="none"/><circle cx="18" cy="0" r="3" fill="#4E7A46" stroke="none"/>
</g>
<text x="520" y="221" font-size="17" font-weight="500" fill="#3B4250" text-anchor="middle">MediaPipe</text>
<text x="520" y="240" font-size="17" font-weight="500" fill="#3B4250" text-anchor="middle">detecta landmarks</text>

<circle cx="720" cy="150" r="48" fill="#FFE6CC" stroke="#D79B00" stroke-width="2.5"/>
