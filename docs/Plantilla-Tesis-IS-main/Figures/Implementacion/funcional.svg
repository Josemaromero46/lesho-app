<path d="M-16,-10 L0,-18 M-16,-10 L0,0 M-16,-10 L0,18 M-16,10 L0,-18 M-16,10 L0,0 M-16,10 L0,18"/>
<path d="M0,-18 L16,-10 M0,-18 L16,10 M0,0 L16,-10 M0,0 L16,10 M0,18 L16,-10 M0,18 L16,10"/>
</g>
<g fill="#B07C10">
<circle cx="-16" cy="-10" r="4"/><circle cx="-16" cy="10" r="4"/>
<circle cx="0" cy="-18" r="4"/><circle cx="0" cy="0" r="4"/><circle cx="0" cy="18" r="4"/>
<circle cx="16" cy="-10" r="4"/><circle cx="16" cy="10" r="4"/>
</g>
</g>
<text x="720" y="221" font-size="17" font-weight="500" fill="#3B4250" text-anchor="middle">Modelos A y B</text>
<text x="720" y="240" font-size="17" font-weight="500" fill="#3B4250" text-anchor="middle">reconocen</text>

<circle cx="920" cy="150" r="48" fill="#E1D5E7" stroke="#9673A6" stroke-width="2.5"/>
<g transform="translate(920,150)" stroke="#6E4E82" fill="none">
<rect x="-17" y="-24" width="34" height="48" rx="5" stroke-width="3"/>
<path d="M-10,-8 H10 M-10,0 H10 M-10,8 H4" stroke-width="2.5" stroke-linecap="round"/>
</g>
<text x="920" y="221" font-size="17" font-weight="500" fill="#3B4250" text-anchor="middle">Texto en</text>
<text x="920" y="240" font-size="17" font-weight="500" fill="#3B4250" text-anchor="middle">pantalla</text>

<line x1="60" y1="308" x2="940" y2="308" stroke="#E3E7ED" stroke-width="1.4"/>

<text x="500" y="352" font-size="20" font-weight="700" fill="#45506A" text-anchor="middle">Dirección 2 · el oyente escribe y la app lo muestra en señas</text>
<g stroke="#5F6B7A" stroke-width="2.5">
<line x1="214" y1="448" x2="346" y2="448" marker-end="url(#fa)"/>
<line x1="454" y1="448" x2="586" y2="448" marker-end="url(#fa)"/>
<line x1="694" y1="448" x2="826" y2="448" marker-end="url(#fa)"/>
</g>

