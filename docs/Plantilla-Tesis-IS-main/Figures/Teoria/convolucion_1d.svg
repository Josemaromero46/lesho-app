<svg viewBox="0 0 1020 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1020" height="470" fill="#ffffff"/>

  <!-- ================= ENTRADA: LA VENTANA ================= -->
  <text x="30" y="34" font-size="18" font-weight="bold" fill="#333333">Ventana de 20 fotogramas</text>
  <text x="30" y="56" font-size="14" fill="#777777">cada fotograma: 126 valores (2 manos × 21 puntos × 3 coordenadas)</text>

  <!-- rejilla de la ventana -->
  <g>
    <rect x="30" y="76" width="400" height="150" fill="#F7F9FC" stroke="#B9C4D4" stroke-width="2"/>
    <!-- columnas = fotogramas -->
    <g stroke="#DDE4EE" stroke-width="1">
      <line x1="50" y1="76" x2="50" y2="226"/><line x1="70" y1="76" x2="70" y2="226"/>
      <line x1="90" y1="76" x2="90" y2="226"/><line x1="110" y1="76" x2="110" y2="226"/>
      <line x1="130" y1="76" x2="130" y2="226"/><line x1="150" y1="76" x2="150" y2="226"/>
      <line x1="170" y1="76" x2="170" y2="226"/><line x1="190" y1="76" x2="190" y2="226"/>
      <line x1="210" y1="76" x2="210" y2="226"/><line x1="230" y1="76" x2="230" y2="226"/>
      <line x1="250" y1="76" x2="250" y2="226"/><line x1="270" y1="76" x2="270" y2="226"/>
      <line x1="290" y1="76" x2="290" y2="226"/><line x1="310" y1="76" x2="310" y2="226"/>
      <line x1="330" y1="76" x2="330" y2="226"/><line x1="350" y1="76" x2="350" y2="226"/>
      <line x1="370" y1="76" x2="370" y2="226"/><line x1="390" y1="76" x2="390" y2="226"/>
      <line x1="410" y1="76" x2="410" y2="226"/>
    </g>
    <!-- filas = valores -->
    <g stroke="#DDE4EE" stroke-width="1">
      <line x1="30" y1="106" x2="430" y2="106"/><line x1="30" y1="136" x2="430" y2="136"/>
      <line x1="30" y1="166" x2="430" y2="166"/><line x1="30" y1="196" x2="430" y2="196"/>
    </g>
  </g>

  <!-- filtro deslizante -->
  <rect x="150" y="70" width="62" height="162" fill="#FFE6CC" fill-opacity="0.55" stroke="#D79B00" stroke-width="3" rx="4"/>
  <text x="181" y="252" font-size="15" font-weight="bold" fill="#9A6A1E" text-anchor="middle">filtro</text>

  <!-- flecha de deslizamiento -->
  <line x1="70" y1="268" x2="392" y2="268" stroke="#D79B00" stroke-width="2.5" stroke-dasharray="7 5"/>
  <path d="M 392 268 l -12 -7 l 0 14 z" fill="#D79B00"/>
  <text x="230" y="290" font-size="15" fill="#9A6A1E" text-anchor="middle">el filtro se desliza sobre el eje del tiempo</text>

  <!-- ejes -->
  <text x="18" y="151" font-size="15" fill="#666666" text-anchor="middle" transform="rotate(-90 18 151)">126 valores</text>

  <!-- ================= FLECHA A LOS BLOQUES ================= -->
  <line x1="446" y1="151" x2="496" y2="151" stroke="#9AA3B0" stroke-width="2.5"/>
  <path d="M 496 151 l -11 -7 l 0 14 z" fill="#9AA3B0"/>

  <!-- ================= BLOQUES DE LA RED ================= -->
  <g>
    <rect x="506" y="100" width="150" height="102" rx="8" fill="#FFE6CC" stroke="#D79B00" stroke-width="2"/>
    <text x="581" y="128" font-size="16" font-weight="bold" fill="#9A6A1E" text-anchor="middle">Bloques</text>
    <text x="581" y="148" font-size="16" font-weight="bold" fill="#9A6A1E" text-anchor="middle">convolucionales</text>
    <text x="581" y="170" font-size="14" fill="#9A6A1E" text-anchor="middle">Conv1D + ReLU</text>
    <text x="581" y="190" font-size="14" fill="#9A6A1E" text-anchor="middle">+ agrupación</text>
  </g>

  <line x1="656" y1="151" x2="692" y2="151" stroke="#9AA3B0" stroke-width="2.5"/>
  <path d="M 692 151 l -11 -7 l 0 14 z" fill="#9AA3B0"/>

  <g>
    <rect x="702" y="100" width="132" height="102" rx="8" fill="#F8CECC" stroke="#B85450" stroke-width="2"/>
    <text x="768" y="138" font-size="16" font-weight="bold" fill="#8A3A36" text-anchor="middle">Capa densa</text>
    <text x="768" y="160" font-size="16" font-weight="bold" fill="#8A3A36" text-anchor="middle">+ dropout</text>
    <text x="768" y="182" font-size="14" fill="#8A3A36" text-anchor="middle">regularización</text>
  </g>

  <line x1="834" y1="151" x2="870" y2="151" stroke="#9AA3B0" stroke-width="2.5"/>
  <path d="M 870 151 l -11 -7 l 0 14 z" fill="#9AA3B0"/>

  <g>
    <rect x="880" y="100" width="120" height="102" rx="8" fill="#E1D5E7" stroke="#9673A6" stroke-width="2"/>
    <text x="940" y="140" font-size="16" font-weight="bold" fill="#6B4C7F" text-anchor="middle">Softmax</text>
    <text x="940" y="164" font-size="14" fill="#6B4C7F" text-anchor="middle">33 clases</text>
    <text x="940" y="184" font-size="14" fill="#6B4C7F" text-anchor="middle">de salida</text>
  </g>

  <!-- ================= QUE APRENDE EL FILTRO ================= -->
  <g>
    <rect x="506" y="250" width="494" height="86" rx="10" fill="#F7F4EE" stroke="#E3DDD2" stroke-width="2"/>
    <text x="753" y="280" font-size="16" font-weight="bold" fill="#333333" text-anchor="middle">Qué detecta el filtro</text>
    <text x="753" y="306" font-size="15" fill="#5C6472" text-anchor="middle">el cambio de forma de la mano entre fotogramas vecinos,</text>
    <text x="753" y="326" font-size="15" fill="#5C6472" text-anchor="middle">que es lo que distingue una letra quieta de una con movimiento</text>
  </g>

  <!-- ================= NORMALIZACION PREVIA ================= -->
  <g>
    <text x="30" y="366" font-size="16" font-weight="bold" fill="#333333">Antes de entrar a la red, cada fotograma se normaliza en dos pasos</text>

    <rect x="30" y="382" width="300" height="62" rx="8" fill="#D5E8D4" stroke="#82B366" stroke-width="2"/>
    <text x="180" y="406" font-size="15" font-weight="bold" fill="#3F6B2E" text-anchor="middle">1 · Trasladar a la muñeca</text>
    <text x="180" y="428" font-size="14" fill="#3F6B2E" text-anchor="middle">quita el efecto de dónde está la mano</text>

    <line x1="342" y1="413" x2="378" y2="413" stroke="#82B366" stroke-width="2.5"/>
    <path d="M 378 413 l -11 -7 l 0 14 z" fill="#82B366"/>

    <rect x="388" y="382" width="300" height="62" rx="8" fill="#D5E8D4" stroke="#82B366" stroke-width="2"/>
    <text x="538" y="406" font-size="15" font-weight="bold" fill="#3F6B2E" text-anchor="middle">2 · Dividir por el tamaño</text>
    <text x="538" y="428" font-size="14" fill="#3F6B2E" text-anchor="middle">quita el efecto de la distancia a la cámara</text>

    <line x1="700" y1="413" x2="736" y2="413" stroke="#82B366" stroke-width="2.5"/>
    <path d="M 736 413 l -11 -7 l 0 14 z" fill="#82B366"/>

    <rect x="746" y="382" width="254" height="62" rx="8" fill="#ffffff" stroke="#82B366" stroke-width="2"/>
    <text x="873" y="406" font-size="15" font-weight="bold" fill="#3F6B2E" text-anchor="middle">La red aprende la forma</text>
    <text x="873" y="428" font-size="14" fill="#3F6B2E" text-anchor="middle">no la posición ni la escala</text>
  </g>
</svg>
